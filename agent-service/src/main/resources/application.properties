spring.application.name=agent-service
server.port=8086

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# MySQL DB Config
spring.datasource.url=jdbc:mysql://localhost:3306/lightwise
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Flyway Config
spring.flyway.enabled=true
spring.flyway.table=agent_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Kafka Config
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=agent-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=alertingEvent:com.lightwise.kafka.event.AlertingEvent
spring.kafka.consumer.auto-offset-reset=earliest

# Service URLs
device.service.url=http://localhost:8081/api/v1/device
usage.service.url=http://localhost:8083/api/v1/usage

# Spring AI Ollama Config
spring.ai.ollama.chat.options.model=deepseek-coder
spring.ai.ollama.init.pull-model-strategy=never
